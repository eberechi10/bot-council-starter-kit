# Serves the public folder at http://localhost:8080/
# Markdown and text files are sent as plain text so any reader can open them.
server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    types {
        text/plain md txt;
        text/html html htm;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
