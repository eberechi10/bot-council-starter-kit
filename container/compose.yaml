# Own-computer hosting (the default route).
# From the kit folder run:
#   docker compose -f container/compose.yaml up -d
# The port comes from PORT in settings.txt (the kit refreshes container/.env).
# Public files are then at  http://localhost:PORT/
services:
  public:
    image: nginx:alpine
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
